/* 5.21.2 — compact help + dedicated delegations page */
.help-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  align-items:start;
}
.help-item{
  align-self:start;
  height:max-content;
  border:1px solid #d9e3ec;
  border-radius:12px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(24,58,88,.03);
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.help-item:hover{border-color:#c7d8e7;box-shadow:0 7px 20px rgba(24,58,88,.07)}
.help-item summary{
  padding:14px 16px;
  cursor:pointer;
  font-weight:700;
  color:#203b58;
  list-style:none;
  min-height:22px;
}
.help-item summary::-webkit-details-marker{display:none}
.help-item summary:before{
  content:'+';
  float:right;
  color:#1a5f96;
  font-size:18px;
  font-weight:700;
  line-height:20px;
}
.help-item[open] summary:before{content:'−'}
.help-body{
  padding:0 16px 14px;
  border-top:1px solid #edf2f6;
  color:#526477;
  line-height:1.5;
}
.help-body p{margin:11px 0 10px;font-size:13px}
.help-step-preview{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:38px;
  padding:7px 9px;
  border:1px solid #e0e9f1;
  border-radius:9px;
  background:#f7fafc;
  box-sizing:border-box;
}
.help-step-path{
  color:#73869a;
  font-size:11px;
  flex:1;
  min-width:0;
}
.help-step-action{
  display:inline-flex;
  align-items:center;
  min-height:25px;
  padding:3px 9px;
  border-radius:7px;
  background:#1a5f96;
  color:#fff;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.delegation-page{padding-bottom:20px}
.page-heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:16px}
.delegation-summary{
  min-width:86px;padding:9px 13px;border:1px solid #dce6ef;border-radius:12px;background:#fff;
  text-align:center;box-shadow:0 3px 12px rgba(25,55,85,.04)
}
.delegation-summary b{display:block;color:#1a5f96;font-size:21px;line-height:1.1}
.delegation-summary span{font-size:11px;color:#73869a}
.delegation-create{margin-bottom:14px}
.delegation-form-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px
}
.delegation-form-grid label{display:flex;flex-direction:column;gap:6px}
.delegation-form-grid label>span{font-size:12px;font-weight:700;color:#425a72}
.delegation-form-grid .required{color:#c33}
.delegation-full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;margin-top:13px}
.form-message{min-height:18px;margin-top:8px;font-size:12px}
.form-message.success{color:#2f7d4a}
.form-message.error{color:#c23a32}
.delegation-list{display:flex;flex-direction:column;gap:9px}
.delegation-card{
  border:1px solid #dce6ef;border-radius:12px;padding:13px 14px;background:#fbfdff;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease
}
.delegation-card:hover{transform:translateY(-1px);border-color:#cbdbe8;box-shadow:0 7px 18px rgba(25,55,85,.06)}
.delegation-card-top{display:flex;align-items:center;gap:10px}
.delegation-avatar{
  width:34px;height:34px;border-radius:10px;background:#eaf3fa;color:#1a5f96;
  display:grid;place-items:center;font-weight:800;flex:0 0 auto
}
.delegation-card-title{min-width:0;flex:1}
.delegation-card-title .eyebrow{font-size:9px;margin-bottom:1px}
.delegation-card-title h3{margin:0;font-size:14px;color:#203b58}
.delegation-status{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}
.delegation-status.active{background:#e8f6ee;color:#2f7d4a}
.delegation-status.pending{background:#fff5df;color:#9a6a00}
.delegation-status.done{background:#edf1f5;color:#708095}
.delegation-period{
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  margin-top:11px;padding-top:10px;border-top:1px solid #edf2f6
}
.delegation-period>div:not(.delegation-arrow){display:flex;flex-direction:column;gap:2px}
.delegation-period span{font-size:9px;color:#7b8da0;text-transform:uppercase;letter-spacing:.04em}
.delegation-period strong{font-size:12px;color:#314c66;font-weight:600}
.delegation-arrow{color:#9aabba;font-size:14px}
.delegation-reason{
  margin-top:9px;padding:7px 9px;border-radius:8px;background:#f4f7fa;color:#65788b;font-size:11px
}
.delegation-empty{padding:25px 12px}

@media(max-width:850px){
  .help-grid,.delegation-form-grid{grid-template-columns:1fr}
  .delegation-full{grid-column:auto}
  .page-heading-row{align-items:flex-start}
}
